<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive design ke liye -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page ka title -->
    <title>Document</title>


    <!-- Chess made as project of Grid-CSS. -->

    <!-- External CSS file ko connect kiya hai -->
    <link rel="stylesheet" href="chess.css">


</head>

<!-- 
    Body ko red background diya hai.
    height: 100vh = poori screen ki height.
    display: flex = flexbox enable.
    justify-content: center = horizontally center.
    align-items: center = vertically center.
-->
<body style="background-color: red; height: 100vh; display: flex; justify-content: center; align-items: center;">

    <!-- Chess board ka main container -->
    <div class="container">


        <!-- Line 1 -->
        <!-- Row 1: Black aur White boxes alternate hain -->
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>


        <!-- Line 2 -->
        <!-- Row 2: White aur Black boxes alternate hain -->
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>


        <!-- Line 3 -->
        <!-- Row 3: Row 1 jaisa pattern repeat -->
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>


        <!-- Line 4 -->
        <!-- Row 4: Row 2 jaisa pattern repeat -->
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>


        <!-- Line 5 -->
        <!-- Row 5: Row 1 jaisa pattern repeat -->
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>


        <!-- Line 6 -->
        <!-- Row 6: Row 2 jaisa pattern repeat -->
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>


        <!-- Line 7 -->
        <!-- Row 7: Row 1 jaisa pattern repeat -->
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>


        <!-- Line 8 -->
        <!-- Row 8: Row 2 jaisa pattern repeat -->
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>


    </div>

</body>
</html>
