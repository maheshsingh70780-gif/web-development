<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"> <!-- text ko sahi dikhane ke liye -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- mobile setting -->
    <title>SignUp Form</title> <!-- browser tab ka naam -->

    <!-- icon ki file -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <link rel="stylesheet" href="styling.css">
</head>

<body>

    <div class="box"> <!-- pura form ka box -->

        <form>

            <h1>SignUp Form</h1> <!-- form ka title -->

            <div class="input-group"> <!-- username wali line -->
                <i class="fas fa-user"></i> <!-- user ka icon -->
                <input type="text" placeholder="Enter Username" required> <!-- naam enter karo -->
            </div>

            <div class="input-group"> <!-- email wali line -->
                <i class="fas fa-envelope"></i> <!-- email ka icon -->
                <input type="email" placeholder="Email:yourname123@gmail.com" required> <!-- email enter karo -->
            </div>

            <div class="input-group"> <!-- password wali line -->
                <i class="fas fa-lock"></i> <!-- lock ka icon -->
                <input type="password" placeholder="Create Password" required> <!-- naya password -->
            </div>

            <div class="input-group"> <!-- password check karne ke liye -->
                <i class="fas fa-lock"></i> <!-- lock icon -->
                <input type="password" placeholder="Confirm Password" required> <!-- password dobara -->
            </div>

            <div> <!-- button ka area -->
                <button type="submit"
                    class="signup-btn"
                    style="width: 100%; height: 35px; font-size: 20px; padding: 4px; background-color: brown; color: gold; cursor: pointer;">
