<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <!-- CSS file ko connect karna -->
    <link rel="stylesheet" href="styler.css">
</head>

<body>

    <!-- Main box -->
    <section class="login-box">

        <form>

            <!-- Form ka heading -->
            <h2>Login Here</h2>

            <!-- Username ka section -->
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username"
                placeholder="Username likho">
            </div>

            <!-- Password ka section -->
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                    placeholder="Password likho">
            </div>

            <!-- Button ke liye thodi jagah -->
            <br>

            <!-- Login button -->
            <button type="submit"
                    style="width: 100%; height: 45px; font-size: 22px; padding: 5px; background-color: purple; color: white;">
                Login
            </button>

        </form>

    </section>

</body>
</html>
